name: finapp

services:
  postgres:
    image: postgres:16-alpine
    container_name: finapp-postgres
    environment:
      POSTGRES_USER: finapp
      POSTGRES_PASSWORD: finapp
      POSTGRES_DB: finapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finapp -d finapp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Aplica as migrations e encerra. O backend so sobe depois que este servico
  # termina com sucesso, garantindo que o schema existe antes da primeira query.
  migrate:
    image: migrate/migrate:v4.17.1
    container_name: finapp-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://finapp:finapp@postgres:5432/finapp?sslmode=disable"
      - "up"

  backend:
    build:
      context: ./backend
    container_name: finapp-backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://finapp:finapp@postgres:5432/finapp?sslmode=disable
      JWT_SECRET: desenvolvimento-local-segredo-de-48-bytes-para-hs256
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      API_KEY_PREFIX: fin_live
      OPENAPI_PATH: /app/docs/openapi.yaml
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # A URL usada pelo navegador do usuario; o proxy do Next fala com o
        # backend pela rede interna do Compose.
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: finapp-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
