name: Deploy NexosFinn

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nexosfinn-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/nexosfinn_deploy
          chmod 600 ~/.ssh/nexosfinn_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update and deploy NexosFinn
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/nexosfinn_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "DEPLOY_SHA=$(printf %q "$DEPLOY_SHA") bash -s" <<'REMOTE'
          set -euo pipefail

          app_dir=/opt/nexosgen/apps/nexosfinn
          git_ssh='ssh -i /home/ubuntu/.ssh/nexosfinn_github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'

          git -C "$app_dir" remote set-url origin git@github.com:jotaGGod/nexosgen-nexosfinn.git
          GIT_SSH_COMMAND="$git_ssh" git -C "$app_dir" fetch --depth=1 origin main
          git -C "$app_dir" checkout --force --detach "$DEPLOY_SHA"

          cd "$app_dir"
          # A VPS tem recursos limitados: construir backend e frontend em
          # sequência evita que o host fique sem resposta durante o deploy.
          docker compose --env-file .env.prod -f compose.prod.yml build backend
          docker compose --env-file .env.prod -f compose.prod.yml build frontend
          docker compose --env-file .env.prod -f compose.prod.yml up -d --no-build
          docker compose --env-file .env.prod -f compose.prod.yml ps

          for attempt in $(seq 1 36); do
            postgres=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' nexosfinn-postgres)
            backend=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' nexosfinn-backend)
            frontend=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' nexosfinn-frontend)
            if [ "$postgres" = healthy ] && [ "$backend" = healthy ] && [ "$frontend" = healthy ]; then
              docker compose --env-file .env.prod -f compose.prod.yml ps
              exit 0
            fi
            sleep 5
          done

          docker compose --env-file .env.prod -f compose.prod.yml ps
          exit 1
          REMOTE
